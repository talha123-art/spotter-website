repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend eslint
        entry: bash -c "cd frontend && npm run lint"
        language: system
        files: ^frontend/src/
        pass_filenames: false
